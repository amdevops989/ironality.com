name: "Reusable CI for Service"

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      path:
        required: true
        type: string
      docker_repo:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      GH_PAT:
        required: true
      VITE_STRIPE_KEY:
        required: false  # Only needed for frontend

permissions:
  contents: write
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Docker login
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Determine image tags
      - name: Determine tags
        id: vars
        run: |
          SERVICE="${{ inputs.service }}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BRANCH="release"
          else
            BRANCH="unknown"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          LAST_TAG=$(git tag --list "${SERVICE}-v*" --sort=-v:refname | head -n1)
          if [[ -z "$LAST_TAG" ]]; then
            NEW_SEMVER="v0.1.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#${SERVICE}-v}"
            PATCH=$((PATCH+1))
            NEW_SEMVER="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "semver=$NEW_SEMVER" >> $GITHUB_OUTPUT

          COMBO_TAG="${BRANCH}-${NEW_SEMVER}"
          echo "combo=$COMBO_TAG" >> $GITHUB_OUTPUT

      # 5️⃣ Build args only for frontend
      - name: Set build args
        id: build_args
        run: |
          if [[ "${{ inputs.service }}" == "frontend" ]]; then
            ARGS="--build-arg VITE_API_CATALOG=http://api.localdev.me/catalog \
          --build-arg VITE_API_AUTH=http://api.localdev.me/auth \
          --build-arg VITE_API_CART=http://api.localdev.me/cart \
          --build-arg VITE_API_ORDERS=http://api.localdev.me/orders \
          --build-arg VITE_API_PAYMENTS=http://api.localdev.me/payments \
          --build-arg VITE_STRIPE_KEY=${{ secrets.VITE_STRIPE_KEY }}"
          else
            ARGS=""  # No build args for other services
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT


      # 6️⃣ Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.path }}
          file: ${{ inputs.path }}/Dockerfile
          load: true
          no-cache: true
          build-args: ${{ steps.build_args.outputs.args }}
          tags: |
            ${{ inputs.docker_repo }}:${{ steps.vars.outputs.combo }}

      # 7️⃣ Trivy scan (FAIL on HIGH/CRITICAL)
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ inputs.docker_repo }}:${{ steps.vars.outputs.combo }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      # 8️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker tag ${{ inputs.docker_repo }}:${{ steps.vars.outputs.combo }} ${{ inputs.docker_repo }}:latest
          docker tag ${{ inputs.docker_repo }}:${{ steps.vars.outputs.combo }} ${{ inputs.docker_repo }}:${{ steps.vars.outputs.branch }}
          docker push ${{ inputs.docker_repo }}:${{ steps.vars.outputs.combo }}
          docker push ${{ inputs.docker_repo }}:latest
          docker push ${{ inputs.docker_repo }}:${{ steps.vars.outputs.branch }}

      # 9️⃣ Push Git tag
      - name: Push Git tag
        if: ${{ success() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          SERVICE="${{ inputs.service }}"
          git config user.name "CI Auto Tag"
          git config user.email "ci-bot@github.com"
          git tag -a "${SERVICE}-${{ steps.vars.outputs.semver }}" -m "CI: release $SERVICE ${{ steps.vars.outputs.semver }}"
          git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} "${SERVICE}-${{ steps.vars.outputs.semver }}"

      # 🔟 Summary
      - name: Summary
        run: |
          echo "✅ Service: ${{ inputs.service }}"
          echo "🔐 Trivy scan: PASSED"
          echo "🐳 Image: ${{ inputs.docker_repo }}:${{ steps.vars.outputs.combo }}"
          echo "🏷️ Git tag: ${{ inputs.service }}-${{ steps.vars.outputs.semver }}"
