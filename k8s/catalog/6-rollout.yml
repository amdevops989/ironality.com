apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: catalog
  namespace: demo
spec:
  replicas: 2
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: catalog

  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        app: catalog
        istio: monitor

    spec:
      containers:
      - name: catalog
        image: devopsflow999/catalog:main-v0.1.2
        imagePullPolicy: IfNotPresent

        envFrom:
          - configMapRef:
              name: catalog-config
          - secretRef:
              name: demo-secrets

        ports:
          - name: http
            containerPort: 3001
            protocol: TCP

        resources:
          requests:
            memory: 32Mi
            cpu: 5m
          limits:
            memory: 128Mi
            cpu: 200m

  strategy:
    canary:
      stableService: catalog-stable
      canaryService: catalog-canary

      trafficRouting:
        istio:
          virtualService:
            name: catalog-vsvc
            routes:
              - catalog-route

      steps:
        - setWeight: 10
        - pause: {}

        - setWeight: 20
        - pause: { duration: 20s }

        - setWeight: 30
        - pause: { duration: 20s }

        - setWeight: 40
        - pause: { duration: 20s }

        - setWeight: 50
        - pause: { duration: 20s }

        - setWeight: 60
        - pause: { duration: 20s }

        - setWeight: 70
        - pause: { duration: 20s }

        - setWeight: 80
        - pause: { duration: 20s }

        - setWeight: 90
        - pause: { duration: 20s }
