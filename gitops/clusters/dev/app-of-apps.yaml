apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cluster
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/amdevops989/ironality.com.git
    targetRevision: main
    path: gitops/clusters/dev/infra
    directory:
      recurse: false   # 🔴 VERY IMPORTANT

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
