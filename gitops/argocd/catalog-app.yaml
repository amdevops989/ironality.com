apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/gitops.git
    targetRevision: main
    path: apps/catalog/overlays/dev
    kustomize:
      enableHelm: true

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
