# Source: catalog/templates/9-prometheus-alerte-rules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: catalog-stable-rules
  namespace: monitoring
  labels:
    release: kube-prom-stack
spec:
  groups:
    - name: istio-catalog-stable-alerts
      rules:

        # ----------------------------------------------------
        # 1. Stable Success Rate Alert (<95%)
        # ----------------------------------------------------
        - alert: IstioCatalogStableLowSuccessRate
          expr: |
            (
              sum(rate(istio_requests_total{
                reporter="destination",
                destination_service_name="catalog-stable",
                response_code=~"2.."
              }[5m]))
              /
              sum(rate(istio_requests_total{
                reporter="destination",
                destination_service_name="catalog-stable"
              }[5m]))
            ) * 100 < 90
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Stable service success rate is low"
            description: "Success rate for catalog-stable dropped below 90%."

        # ----------------------------------------------------
        # 2. Stable 5xx Error Rate Alert (>1%)
        # ----------------------------------------------------
        - alert: IstioCatalogStableHigh5xxRate
          expr: |
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="catalog-stable",
              response_code=~"5.."
            }[5m]))
            /
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="catalog-stable"
            }[5m]))
            > 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Stable service 5xx error rate is too high"
            description: "More than 0% of requests to catalog-stable are 5xx errors."

        # ----------------------------------------------------
        # 3. Stable P95 Latency Alert (>500ms)
        # ----------------------------------------------------
        - alert: IstioCatalogStableHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(istio_request_duration_milliseconds_bucket{
                reporter="destination",
                destination_service_name="catalog-stable"
              }[5m])) by (le)
            ) > 800
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Stable service P95 latency is high"
            description: "P95 latency for catalog-stable exceeded 800ms."
