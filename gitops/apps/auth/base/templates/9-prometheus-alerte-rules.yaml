apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}-stable-rules
  namespace: {{ .Values.monitoringNamespace | default "monitoring" }}
  labels:
    release: {{ .Values.prometheusRule.release | default "kube-prom-stack" }}
spec:
  groups:
    - name: istio-{{ .Chart.Name }}-stable-alerts
      rules:

        # ----------------------------------------------------
        # 1. Stable Success Rate Alert (< threshold)
        # ----------------------------------------------------
        - alert: Istio{{ .Chart.Name | title }}StableLowSuccessRate
          expr: |
            (
              sum(rate(istio_requests_total{
                reporter="destination",
                destination_service_name="{{ .Values.strategy.stableService }}",
                response_code=~"2.."
              }[5m]))
              /
              sum(rate(istio_requests_total{
                reporter="destination",
                destination_service_name="{{ .Values.strategy.stableService }}"
              }[5m]))
            ) * 100 < {{ .Values.alerts.successRateThreshold }}
          for: {{ .Values.alerts.successRateFor }}
          labels:
            severity: warning
          annotations:
            summary: "Stable service success rate is low"
            description: "Success rate for {{ .Values.strategy.stableService }} dropped below {{ .Values.alerts.successRateThreshold }}%."

        # ----------------------------------------------------
        # 2. Stable 5xx Error Rate Alert (> threshold)
        # ----------------------------------------------------
        - alert: Istio{{ .Chart.Name | title }}StableHigh5xxRate
          expr: |
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.strategy.stableService }}",
              response_code=~"5.."
            }[5m]))
            /
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.strategy.stableService }}"
            }[5m]))
            > {{ .Values.alerts.errorRateThreshold }}
          for: {{ .Values.alerts.errorRateFor }}
          labels:
            severity: critical
          annotations:
            summary: "Stable service 5xx error rate is too high"
            description: "More than {{ mul .Values.alerts.errorRateThreshold 100 }}% of requests to {{ .Values.strategy.stableService }} are 5xx errors."

        # ----------------------------------------------------
        # 3. Stable P95 Latency Alert (> threshold ms)
        # ----------------------------------------------------
        - alert: Istio{{ .Chart.Name | title }}StableHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(istio_request_duration_milliseconds_bucket{
                reporter="destination",
                destination_service_name="{{ .Values.strategy.stableService }}"
              }[5m])) by (le)
            ) > {{ .Values.alerts.latencyP95Threshold }}
          for: {{ .Values.alerts.latencyP95For }}
          labels:
            severity: warning
          annotations:
            summary: "Stable service P95 latency is high"
            description: "P95 latency for {{ .Values.strategy.stableService }} exceeded {{ .Values.alerts.latencyP95Threshold }}ms."

