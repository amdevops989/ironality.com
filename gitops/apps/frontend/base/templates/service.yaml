apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  namespace: demo
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-stable
  namespace: demo
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
