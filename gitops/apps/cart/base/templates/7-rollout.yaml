apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cart
  namespace: {{ .Values.namespace | default "demo" }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 1 }}
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        app: cart
        istio: monitor
    spec:
      containers:
      - name: cart
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        envFrom:
        - configMapRef:
            name: cart-config
        - secretRef:
            name: app-secrets
        ports:
        - name: http
          containerPort: {{ .Values.service.port | default 3003 }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.metrics.port | default 9466 }}
          protocol: TCP
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
            memory: {{ .Values.resources.requests.memory | default "128Mi" }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | default "500m" }}
            memory: {{ .Values.resources.limits.memory | default "256Mi" }}
  strategy:
    canary:
      canaryService: cart-canary
      stableService: cart-stable
      trafficRouting:
        istio:
          virtualService:
            name: cart-vsvc
            routes:
            - cart-stable
      steps:
      {{- range .Values.strategy.steps }}
      - setWeight: {{ .weight }}
        pause: {{ .pause | toYaml | nindent 8 }}
      {{- end }}
