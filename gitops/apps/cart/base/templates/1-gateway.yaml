apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway | default "api-gateway" }}
  namespace: {{ .Values.namespace | default "dev" }}
spec:
  selector:
    istio: gateway

  servers:
    # HTTP
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.host | quote }}

{{- if .Values.istio.tls.enabled }}
    # HTTPS
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tls.secretName | quote }}
      hosts:
        - {{ .Values.host | quote }}
{{- end }}
