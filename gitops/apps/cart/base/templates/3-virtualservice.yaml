apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cart-vsvc
  namespace: {{ .Values.namespace | default "dev" }}
spec:
  hosts:
    - "{{ .Values.api.host | default "api.travelersources.com" }}"
  gateways:
    - {{ .Values.api.gateway | default "api-gateway" }}
  http:

    # ----------------- Canary Route -----------------
    - name: cart-canary
      match:
        - uri:
            prefix: "/cart/cart"
          headers:
            x-canary:
              exact: "true"
      rewrite:
        uri: "/cart"
      route:
        - destination:
            host: cart-canary
            port:
              number: {{ .Values.service.port | default 3003 }}
          weight: 100

    # ----------------- Stable Route -----------------
    - name: cart-stable
      match:
        - uri:
            prefix: "/cart/cart"
      rewrite:
        uri: "/cart"
      corsPolicy:
        allowOrigins:
          - exact: "{{ .Values.frontend.url | default "https://travelersources.com" }}"
        allowMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
        allowHeaders: ["*"]
        allowCredentials: true
        maxAge: "1h"
      route:
        - destination:
            host: cart-stable
            port:
              number: {{ .Values.service.port | default 3003 }}
          weight: 100
        - destination:
            host: cart-canary
            port:
              number: {{ .Values.service.port | default 3003 }}
          weight: 0
